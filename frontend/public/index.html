<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="site-header">
        <div class="brand">Task Manager</div>
        <div class="header-actions">
            <input id="search" placeholder="Search tasks..." />
        </div>
    </header>

    <main class="container">
        <section class="panel left">
            <h2>Create Task</h2>
            <label for="title">Task Title *</label>
            <input id="title" placeholder="Task title..." />
            <label for="description">Description</label>
            <textarea id="description" placeholder="Task details..."></textarea>
            <div class="create-meta">Title is required</div>
            <div class="left-actions">
                <button id="create">+ Create Task</button>
                <button id="clear" class="btn-muted">Clear</button>
            </div>
        </section>
        <section class="panel right">
            <div class="tasks-header">
                <h2>Tasks (<span id="count">0</span>)</h2>
                <div class="filters">
                    <button data-filter="all" class="filter active">All</button>
                    <button data-filter="pending" class="filter">Pending</button>
                    <button data-filter="completed" class="filter">Completed</button>
                </div>
            </div>
            <div class="tasks-list" id="tasks"></div>
        </section>
    </main>

    <!-- Edit modal -->
    <div id="modal" class="modal hidden" role="dialog" aria-hidden="true">
        <div class="modal-panel">
            <h3>Edit Task</h3>
            <label>Title</label>
            <input id="edit-title" />
            <label>Description</label>
            <textarea id="edit-description"></textarea>
            <label>Status</label>
            <select id="edit-status">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <div class="modal-actions">
                <button id="save-edit">Save</button>
                <button id="cancel-edit" class="btn-muted">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
